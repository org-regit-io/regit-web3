[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_types = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[package]
name = "regit-web3"
description = "Reusable Rust primitives for typed Web3 operations and observations"
repository = "https://github.com/org-regit-io/regit-web3"
readme = "README.md"
exclude = ["/doc/", "/sbom/", "/target/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobins = false

[lints]
workspace = true

[[example]]
name = "native_balance"
required-features = ["evm-http"]

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = [
  "std",
], optional = true }
bigdecimal = { version = "=0.4.11", default-features = false, features = [
  "std",
] }
bitcoin = { version = "=0.32.102", default-features = false, features = [
  "std",
], optional = true }
const-hex = { version = "=1.19.3", default-features = false, features = [
  "std",
] }
crc = { version = "=3.4.0", default-features = false, optional = true }
ethaddr = { version = "=0.2.4", default-features = false, features = ["sha3"] }
pallas-addresses = { version = "=1.4.0", default-features = false, optional = true }
pallas-codec = { version = "=1.4.0", default-features = false, optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls",
], optional = true }
ruint = { version = "=1.20.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = [
  "arbitrary_precision",
  "raw_value",
], optional = true }
solana-address = { version = "=2.9.0", default-features = false, features = [
  "std",
  "copy",
], optional = true }
solana-hash = { version = "=4.7.0", default-features = false, features = [
  "std",
  "decode",
  "copy",
], optional = true }
solana-signature = { version = "=3.6.0", default-features = false, features = [
  "std",
], optional = true }
tokio = { version = "=1.53.2", default-features = false, features = [
  "rt",
  "time",
], optional = true }
url = { version = "=2.5.8", default-features = false, features = [
  "std",
], optional = true }

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", default-features = false, features = [
  "macros",
  "rt",
  "net",
  "io-util",
  "time",
] }

[features]
default = []

http = ["dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url"]
evm = []
evm-http = ["evm", "http"]
solana = ["dep:solana-address", "dep:solana-hash", "dep:solana-signature"]
solana-http = ["solana", "http", "dep:base64"]
cardano = ["dep:pallas-addresses", "dep:pallas-codec", "dep:crc"]
bitcoin = ["dep:bitcoin"]
bitcoin-esplora = ["bitcoin", "http"]
litecoin = []
dogecoin = []
bitcoin-cash = []
xrpl = []
ton = []
thorchain = []

jupiter = ["solana"]
uniswap = ["evm"]
oneinch = ["evm"]
lifi = []
rubic = []

coingecko = []
defillama = []
helius = ["solana"]
blockfrost = ["cardano"]
blockfrost-http = ["blockfrost", "http"]
mempool-space = ["bitcoin"]

all = [
  "evm",
  "evm-http",
  "solana",
  "solana-http",
  "cardano",
  "bitcoin",
  "bitcoin-esplora",
  "litecoin",
  "dogecoin",
  "bitcoin-cash",
  "xrpl",
  "ton",
  "thorchain",
  "jupiter",
  "uniswap",
  "oneinch",
  "lifi",
  "rubic",
  "coingecko",
  "defillama",
  "helius",
  "blockfrost",
  "blockfrost-http",
  "mempool-space",
]
