[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_types = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[package]
name = "regit-web3"
description = "Reusable Rust primitives for typed Web3 operations and observations"
repository = "https://github.com/org-regit-io/regit-web3"
readme = "README.md"
exclude = ["/doc/", "/sbom/", "/target/", "/key.txt", "/key-*.txt"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobins = false

[lints]
workspace = true

[[example]]
name = "native_balance"
required-features = ["evm-http"]

[dependencies]
solana-message = { version = "=5.1.0", default-features = false, features = [
  "std",
  "wincode",
], optional = true }
solana-transaction = { version = "=5.1.0", default-features = false, features = [
  "std",
  "wincode",
], optional = true }
solana-system-interface = { version = "=3.3.0", default-features = false, features = [
  "std",
  "wincode",
], optional = true }
solana-instruction = { version = "=4.0.0", default-features = false, features = [
  "std",
], optional = true }
solana-transaction-error = { version = "=4.1.0", default-features = false, features = [
  "serde",
], optional = true }
wincode = { version = "=0.6.2", default-features = false, features = [
  "std",
], optional = true }
spl-token-interface = { version = "=3.0.0", optional = true }
alloy-rlp = { version = "=0.3.16", default-features = false, features = [
  "std",
], optional = true }
bech32 = { version = "=0.11.1", default-features = false, features = [
  "std",
], optional = true }
base64 = { version = "=0.23.1", default-features = false, features = [
  "std",
], optional = true }
bigdecimal = { version = "=0.4.11", default-features = false, features = [
  "std",
] }
bitcoin = { version = "=0.32.102", default-features = false, features = [
  "std",
], optional = true }
bs58 = { version = "=0.5.1", default-features = false, features = [
  "std",
], optional = true }
cashaddr = { version = "=0.2.0", default-features = false, optional = true }
const-hex = { version = "=1.19.3", default-features = false, features = [
  "std",
] }
crc = { version = "=3.4.0", default-features = false, optional = true }
ethaddr = { version = "=0.2.4", default-features = false, features = ["sha3"] }
pallas-primitives = { version = "=1.4.0", default-features = false, optional = true }
pallas-crypto = { version = "=1.4.0", default-features = false, optional = true }
pallas-addresses = { version = "=1.4.0", default-features = false, optional = true }
pallas-codec = { version = "=1.4.0", default-features = false, optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls",
], optional = true }
rustls = { version = "=0.23.45", default-features = false, features = [
  "std",
  "aws_lc_rs",
  "tls12",
], optional = true }
ruint = { version = "=1.20.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = [
  "arbitrary_precision",
  "raw_value",
], optional = true }
sha2 = { version = "=0.10.9", default-features = false, features = [
  "std",
], optional = true }
sha3 = { version = "=0.12.0", default-features = false, optional = true }
solana-address = { version = "=2.9.0", default-features = false, features = [
  "std",
  "copy",
], optional = true }
solana-hash = { version = "=4.7.0", default-features = false, features = [
  "std",
  "decode",
  "copy",
], optional = true }
solana-signature = { version = "=3.6.0", default-features = false, features = [
  "std",
], optional = true }
tokio = { version = "=1.53.2", default-features = false, features = [
  "rt",
  "time",
], optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
], optional = true }
tycho-types = { version = "=0.3.5", default-features = false, features = [
  "models",
  "sync",
], optional = true }
url = { version = "=2.5.8", default-features = false, features = [
  "std",
], optional = true }

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", default-features = false, features = [
  "macros",
  "rt",
  "net",
  "io-util",
  "time",
] }

[features]
default = []

http = ["dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url"]
evm = ["dep:alloy-rlp", "dep:sha3"]
evm-http = ["evm", "http"]
solana = [
  "dep:bs58",
  "dep:solana-address",
  "dep:solana-hash",
  "dep:solana-signature",
  "dep:solana-message",
  "dep:solana-transaction",
  "dep:solana-system-interface",
  "dep:solana-instruction",
  "dep:solana-transaction-error",
  "dep:wincode",
  "dep:spl-token-interface",
]
solana-http = ["solana", "http", "dep:base64"]
cardano = [
  "dep:pallas-addresses",
  "dep:pallas-codec",
  "dep:crc",
  "dep:pallas-primitives",
  "dep:pallas-crypto",
  "dep:bech32",
]
bitcoin = ["dep:bitcoin"]
bitcoin-esplora = ["bitcoin", "http"]
litecoin = ["dep:bech32", "dep:bs58", "bs58/check"]
litecoin-http = ["litecoin", "http"]
dogecoin = ["dep:bs58", "bs58/check"]
dogecoin-http = ["dogecoin", "http"]
bitcoin-cash = ["dep:cashaddr", "dep:bs58", "bs58/check", "dep:sha2"]
bitcoin-cash-electrum = [
  "bitcoin-cash",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:tokio",
  "tokio/net",
  "tokio/io-util",
  "dep:serde_json",
]
xrpl = ["dep:bs58", "bs58/check", "dep:sha2"]
xrpl-http = ["xrpl", "http"]
ton = ["dep:tycho-types", "dep:base64", "dep:crc"]
ton-http = ["ton", "http"]
thorchain = ["dep:bech32", "dep:bs58"]
thorchain-http = ["thorchain", "http"]

jupiter = ["solana", "dep:base64"]
jupiter-http = ["jupiter", "http", "solana-http"]
uniswap = ["evm"]
uniswap-http = ["uniswap", "evm-http"]
oneinch = ["evm"]
oneinch-http = ["oneinch", "http"]
lifi = ["dep:bs58", "dep:base64", "dep:bitcoin"]
lifi-http = ["lifi", "http"]
rubic = ["evm", "solana", "dep:base64", "dep:serde_json"]
rubic-http = ["rubic", "http"]

coingecko = []
coingecko-http = ["coingecko", "http"]
defillama = []
defillama-http = ["defillama", "http"]
helius = ["solana"]
helius-http = ["helius", "http"]
blockfrost = ["cardano"]
blockfrost-http = ["blockfrost", "http"]
mempool-space = ["bitcoin"]
mempool-space-http = ["mempool-space", "bitcoin-esplora"]

all = [
  "evm",
  "evm-http",
  "solana",
  "solana-http",
  "cardano",
  "bitcoin",
  "bitcoin-esplora",
  "litecoin",
  "litecoin-http",
  "dogecoin",
  "dogecoin-http",
  "bitcoin-cash",
  "bitcoin-cash-electrum",
  "xrpl",
  "xrpl-http",
  "ton",
  "ton-http",
  "thorchain",
  "thorchain-http",
  "jupiter",
  "jupiter-http",
  "uniswap",
  "uniswap-http",
  "oneinch",
  "oneinch-http",
  "lifi",
  "lifi-http",
  "rubic",
  "rubic-http",
  "coingecko",
  "coingecko-http",
  "defillama",
  "defillama-http",
  "helius",
  "helius-http",
  "blockfrost",
  "blockfrost-http",
  "mempool-space",
  "mempool-space-http",
]
