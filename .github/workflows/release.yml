# Manual cross-platform library/example builds and offline fixtures; no publication.
name: release-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup show
      - name: fetch locked dependencies
        run: cargo fetch --locked
      - name: build library
        run: cargo build --release --lib --all-features --locked --offline
      - name: build examples
        run: cargo build --release --examples --all-features --locked --offline
      - name: offline fixture tests
        run: cargo test --lib --tests --all-features --locked --offline
