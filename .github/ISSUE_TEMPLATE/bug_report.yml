name: Bug report
description: Report a reproducible library defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Include public, reproducible inputs only.
        Remove secrets, private keys, provider credentials and sensitive transaction data from code, URLs and logs.
  - type: input
    id: revision
    attributes:
      label: Crate version or Git revision
      placeholder: "1.0.0 or an exact Git revision"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and enabled features
      description: Include Rust version, target, Cargo features and the affected chain, protocol or provider profile.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Share the smallest Rust example or fixture that reproduces the issue without credentials.
      render: rust
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant fixed errors or redacted output and the command used.
    validations:
      required: true
