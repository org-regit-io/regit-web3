name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include a minimal Rust API reproducer, enabled Cargo features, expected result, and actual result. Redact keys and private transaction data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
    validations:
      required: true
