[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]

# Reviewed certificate-data license: https://cdla.dev/permissive-2-0/
# The released license text is retained in LICENSES/CDLA-Permissive-2.0.txt.
[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]

# bitcoin 0.32.102 uses hex_lit for compile-time hexadecimal literals.
# Reviewed license: https://spdx.org/licenses/MITNFA.html
# Canonical text and released author attribution are retained in LICENSES/ and NOTICE.
[[licenses.exceptions]]
name = "hex_lit"
version = "=0.1.1"
allow = ["MITNFA"]

# pallas-codec 1.4.0 uses minicbor and its derive macros for Cardano CBOR decoding.
# Reviewed license: https://blueoakcouncil.org/license/1.0.0
# The identical released texts are retained in LICENSES/BlueOak-1.0.0.md.
[[licenses.exceptions]]
name = "minicbor"
version = "=0.26.5"
allow = ["BlueOak-1.0.0"]

[[licenses.exceptions]]
name = "minicbor-derive"
version = "=0.16.2"
allow = ["BlueOak-1.0.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
